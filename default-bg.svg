<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d5016"/>
      <stop offset="55%" stop-color="#3d6b20"/>
      <stop offset="100%" stop-color="#6b8e3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0c040" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0c040" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- subtle rolling hills -->
  <path d="M0 760 C 300 680 520 820 820 740 C 1100 670 1320 800 1600 720 L1600 1000 L0 1000 Z" fill="#24410f" opacity="0.6"/>
  <path d="M0 850 C 350 790 600 900 900 840 C 1200 780 1400 880 1600 820 L1600 1000 L0 1000 Z" fill="#1b320b" opacity="0.7"/>
  <!-- faint cross motif -->
  <g opacity="0.10" fill="#ffffff">
    <rect x="770" y="200" width="60" height="320" rx="8"/>
    <rect x="690" y="280" width="220" height="60" rx="8"/>
  </g>
  <!-- scattered soft notes -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="300" cy="300" r="26"/>
    <rect x="322" y="210" width="8" height="100"/>
    <circle cx="1250" cy="420" r="26"/>
    <rect x="1272" y="330" width="8" height="100"/>
    <circle cx="520" cy="480" r="20"/>
    <rect x="537" y="410" width="7" height="80"/>
  </g>
</svg>
